<title>Maquettes Coupe Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500&family=Oswald:wght@600&family=Space+Grotesk:wght@600&display=swap">
<style>
/* Mise en page : une barre de choix du thème, puis les 6 écrans en grille de téléphones.
   Les couleurs de la page (chrome) sont séparées de celles des thèmes de l'appli. */
:root{
  --c-bg:#EEF0F1; --c-fg:#14181B; --c-mute:#566067; --c-line:#CDD3D7; --c-card:#FFFFFF; --c-on:#FFFFFF; --c-act:#14181B;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c-bg:#101214;--c-fg:#ECEFF1;--c-mute:#A3ADB3;--c-line:#2E353A;--c-card:#181B1E;--c-on:#101214;--c-act:#ECEFF1;color-scheme:dark}}
:root[data-theme="dark"]{--c-bg:#101214;--c-fg:#ECEFF1;--c-mute:#A3ADB3;--c-line:#2E353A;--c-card:#181B1E;--c-on:#101214;--c-act:#ECEFF1;color-scheme:dark}
body{background:var(--c-bg);color:var(--c-fg);font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:1240px;margin:0 auto}
h1{font:600 28px/1.2 "Space Grotesk",system-ui,sans-serif;margin:0 0 8px;text-wrap:balance}
.lead{margin:0 0 24px;color:var(--c-mute);max-width:65ch}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 24px}
.bar button{min-height:48px;padding:0 24px;border:1px solid var(--c-line);background:var(--c-card);color:var(--c-fg);font:500 16px Inter,sans-serif;border-radius:8px;cursor:pointer}
.bar button[aria-pressed="true"]{background:var(--c-act);color:var(--c-on);border-color:var(--c-act)}
.bar button:focus-visible,.app button:focus-visible,.app a:focus-visible{outline:2px solid var(--pri,#0F5C6B);outline-offset:2px}
.facts{display:flex;flex-wrap:wrap;gap:8px 24px;margin:0 0 32px;padding:0;list-style:none;color:var(--c-mute);font-size:16px}
.facts b{color:var(--c-fg);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,344px),1fr));gap:32px 24px;justify-items:center}
.cell{width:100%;max-width:360px;min-width:0}
.cap{margin:0 0 8px;color:var(--c-mute);font-size:16px}
.cap b{color:var(--c-fg);font-weight:500}

/* ===== Appli : variables de thème (DESIGN.md) ===== */
.app{--fond:#F4F5F6;--surf:#FFFFFF;--txt:#14181B;--pri:#0F5C6B;--on:#F4F5F6;--al:#B3261E;--r:12px;
  --fh:"Space Grotesk",system-ui,sans-serif;--tt:none;--ls:0;
  --line:color-mix(in srgb,var(--txt) 15%,transparent);
  background:var(--fond);color:var(--txt);border:1px solid var(--c-line);border-radius:24px;overflow:hidden;
  display:flex;flex-direction:column;height:776px;font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.5}
.app[data-t="salon"]{--fond:#FBF8F7;--surf:#FFFFFF;--txt:#2E2321;--pri:#A35A66;--on:#FBF8F7;--al:#B3261E;--r:16px;--fh:Fraunces,Georgia,serif}
.app[data-t="barber"]{--fond:#F2F0EB;--surf:#FFFFFF;--txt:#111111;--pri:#C8102E;--on:#FFFFFF;--sel:#2B59C3;--tabc:#2B59C3;--al:#B36B00;--line:color-mix(in srgb,var(--txt) 35%,transparent);--r:4px;--fh:Oswald,"Arial Narrow",sans-serif;--tt:uppercase;--ls:.04em}
.body{flex:1;min-height:0;overflow:auto;padding:24px 16px 16px;display:flex;flex-direction:column;gap:24px}
.app h2{margin:0;font:600 28px/1.2 var(--fh);text-transform:var(--tt);letter-spacing:var(--ls);text-wrap:balance}
.app h3{margin:0 0 8px;font:600 20px/1.2 var(--fh);text-transform:var(--tt);letter-spacing:var(--ls)}
.sub{margin:8px 0 0;opacity:.7}
.mute{opacity:.7}
.lab{display:block;margin:0 0 8px;font-weight:500}
.grp{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;padding:0 16px;border:1px solid var(--line);background:var(--surf);color:var(--txt);border-radius:var(--r);font:500 16px Inter,sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--sel,var(--pri));color:var(--on);border-color:var(--sel,var(--pri))}
.stripes{display:none;height:16px;overflow:hidden;flex:none;background:var(--txt)}
.app[data-t="barber"] .stripes{display:flex;gap:0}
.stripes i{flex:none;width:16px;height:16px;transform:skewX(-35deg)}
.stripes i:nth-child(3n+1){background:#C8102E}.stripes i:nth-child(3n+2){background:#FFFFFF}.stripes i:nth-child(3n){background:#2B59C3}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:56px;border:0;border-radius:var(--r);background:var(--pri);color:var(--on);font:500 16px Inter,sans-serif;cursor:pointer;text-decoration:none}
.btn2{display:flex;align-items:center;justify-content:center;flex:1;min-width:0;height:48px;border:1px solid var(--line);border-radius:var(--r);background:transparent;color:var(--txt);font:500 16px Inter,sans-serif;cursor:pointer;text-decoration:none}
.row{display:flex;gap:8px}
.carte{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:16px;color:var(--txt)}
.cuts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cut{display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;font:inherit}
.cut svg{width:100%;height:72px;stroke:var(--txt);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cut b{font:600 16px/1.2 var(--fh);text-transform:var(--tt);letter-spacing:var(--ls)}
.cut span{opacity:.7}
.cut.on{border-color:var(--pri);border-width:2px}
.alerte{border-left:4px solid var(--al);padding:8px 16px;background:var(--surf);border-radius:0 var(--r) var(--r) 0}
.alerte b{font-weight:500}
.range{width:100%;accent-color:var(--pri);height:48px;margin:0}
.rl{display:flex;justify-content:space-between;opacity:.7;font-size:12px}
.sw{height:56px;border:1px solid var(--line);border-radius:var(--r)}
.fonds{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px 8px}
.fond{display:flex;flex-direction:column;gap:8px;padding:0;border:0;background:none;color:var(--txt);font:inherit;font-size:12px;text-align:left;cursor:pointer}
.fond[aria-pressed="true"] .sw{border:2px solid var(--pri)}
.prompt{font:400 12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;margin:8px 0 16px;padding:8px;background:var(--fond);border:1px solid var(--line);border-radius:var(--r);max-height:96px;overflow:hidden}
.step{display:flex;align-items:center;gap:8px;font-size:12px;opacity:.7;margin:0}
.tabs{display:flex;border-top:1px solid var(--line);background:var(--surf);padding-bottom:8px}
.tab{flex:1;min-width:0;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-size:12px;color:var(--txt);opacity:.7;background:none;border:0;font-family:inherit;cursor:pointer}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--tabc,var(--pri));opacity:1}
@media (prefers-reduced-motion:no-preference){.chip,.btn,.btn2,.cut{transition:background-color .15s}}
</style>

<div class="wrap">
  <h1>Maquettes Coupe Studio</h1>
  <p class="lead">Les 6 écrans de la V1 dans les 3 thèmes du DESIGN.md. Choisis un thème : tout change ensemble, la structure reste la même. Les boutons et les choix sont cliquables pour sentir l'écran.</p>
  <div class="bar" role="group" aria-label="Thème">
    <button type="button" data-set="neutre" aria-pressed="true">Neutre</button>
    <button type="button" data-set="salon" aria-pressed="false">Salon</button>
    <button type="button" data-set="barber" aria-pressed="false">Barber</button>
  </div>
  <ul class="facts" id="facts"></ul>
  <div class="grid" id="grid"></div>
</div>

<script>
var THEMES={
 neutre:{nom:'Neutre',facts:['Space Grotesk + Inter','Bleu pétrole #0F5C6B','Coins 12 px','Contraste bouton 7,0']},
 salon:{nom:'Salon',facts:['Fraunces + Inter','Vieux rose #A35A66','Coins 16 px','Contraste bouton 4,7']},
 barber:{nom:'Barber',facts:['Oswald + Inter','Blanc cassé et noir, rouge #C8102E, bleu #2B59C3','Rayures de barber en bandeau','Coins 4 px','Contraste bouton 5,9']}
};
var HAIR={
 fade:'M20 36C18 18 46 18 44 36M22 27C28 22 38 22 42 27',
 crop:'M19 36C17 15 47 15 45 36M21 27H43',
 quiff:'M19 36C14 14 38 6 48 22C46 28 45 32 45 36',
 slick:'M19 36C18 17 46 17 45 36M24 22C32 19 38 20 43 26',
 buzz:'M20 33C20 20 44 20 44 33',
 taper:'M19 36C18 16 46 16 45 36M26 20C30 24 36 24 40 20',
 carre:'M17 52V30C17 10 47 10 47 30V52M17 52H22M47 52H42',
 pixie:'M19 36C17 15 47 15 45 36M19 36L22 44M45 36L42 44',
 shag:'M16 50L18 30C18 10 46 10 46 30L48 50M24 18L22 28M40 18L42 28',
 wolf:'M15 54L17 30C17 10 47 10 47 30L49 54M22 20C28 28 36 28 42 20',
 rideau:'M17 50V30C17 10 47 10 47 30V50M32 14C26 22 24 28 24 32M32 14C38 22 40 28 40 32',
 long:'M15 58V30C15 8 49 8 49 30V58'
};
function sil(k){return '<svg viewBox="0 0 64 64" aria-hidden="true"><ellipse cx="32" cy="38" rx="12" ry="15"/><path d="M26 52V58M38 52V58"/><path d="'+HAIR[k]+'"/></svg>'}
var BARB=[['Skin fade','Fondu à blanc, dessus court','fade'],['Crop texturé','Frange courte, côtés nets','crop'],['Taper bas','Fondu discret sur la nuque','taper'],['Quiff','Dessus relevé vers l\'avant','quiff'],['Slick back','Peigné en arrière, brillant','slick'],['Buzz cut','Tondeuse sur toute la tête','buzz']];
var SAL=[['Carré plongeant','Plus long devant','carre'],['Pixie','Court, dégagé sur la nuque','pixie'],['Shag','Couches marquées, volume','shag'],['Wolf cut','Longueurs et couches mêlées','wolf'],['Frange rideau','Ouverte au milieu','rideau'],['Long en couches','Mouvement, longueur gardée','long']];
var MIX=[BARB[0],SAL[0],BARB[1],SAL[2],BARB[3],SAL[1]];
var ICON={
 home:'<path d="M4 11L12 4L20 11V20H4Z"/>',
 cat:'<rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/>',
 rec:'<path d="M5 8H19M5 16H19"/><circle cx="9" cy="8" r="2"/><circle cx="15" cy="16" r="2"/>',
 cli:'<circle cx="12" cy="8" r="4"/><path d="M4 20C4 15 20 15 20 20"/>',
 res:'<path d="M5 12L10 17L19 7"/>'
};
function tabs(on){
 var t=[['home','Accueil'],['cat','Catalogue'],['rec','Recette'],['cli','Client'],['res','Résultat']];
 return '<nav class="tabs" aria-label="Navigation">'+t.map(function(x){return '<button type="button" class="tab"'+(x[0]===on?' aria-current="page"':'')+'><svg viewBox="0 0 24 24" aria-hidden="true">'+ICON[x[0]]+'</svg>'+x[1]+'</button>'}).join('')+'</nav>';
}
function chips(arr,sel){return '<div class="grp">'+arr.map(function(a,i){return '<button type="button" class="chip" aria-pressed="'+(i===sel)+'">'+a+'</button>'}).join('')+'</div>'}
function mode(t){return t==='salon'?'salon':'barber'}

var SCREENS=[
 {n:'Accueil',tab:'home',html:function(t){
  var m=t==='neutre'?-1:(t==='salon'?1:0);
  return '<div><h2>Coupe Studio</h2><p class="sub">Montre la coupe avant de la faire.</p></div>'+
  '<div><span class="lab">Tu travailles en</span><div class="row">'+
  ['Barber','Salon'].map(function(x,i){return '<button type="button" class="chip" style="flex:1" aria-pressed="'+(i===m)+'">'+x+'</button>'}).join('')+'</div></div>'+
  '<div><h3>Mes recettes</h3><div class="carte" style="display:flex;flex-direction:column;gap:8px"><b style="font-weight:500">'+(t==='salon'?'Carré plongeant, balayage':'Skin fade, dessus texturé')+'</b><span class="mute">Enregistrée hier</span></div></div>'+
  '<div style="margin-top:auto"><button type="button" class="btn">Choisir une coupe</button></div>';}},
 {n:'Catalogue',tab:'cat',html:function(t){
  var L=t==='neutre'?MIX:(t==='salon'?SAL:BARB);
  return '<div><h2>Catalogue</h2><p class="sub">'+(t==='neutre'?'Barber et salon':(t==='salon'?'12 coupes salon':'12 coupes barber'))+'</p></div>'+
  '<div class="cuts">'+L.map(function(c,i){return '<button type="button" class="carte cut'+(i===0?' on':'')+'">'+sil(c[2])+'<b>'+c[0]+'</b><span>'+c[1]+'</span></button>'}).join('')+'</div>'+
  '<button type="button" class="btn2" style="flex:none">Ajouter ma coupe</button>';}},
 {n:'Recette',tab:'rec',html:function(t){
  if(t==='salon') return '<div><h2>Carré plongeant</h2><p class="sub">Règle chaque ingrédient.</p></div>'+
   '<div><span class="lab">Longueur</span><input class="range" type="range" min="10" max="60" value="30" aria-label="Longueur en centimètres"><div class="rl"><span>10 cm</span><span>30 cm, aux épaules</span><span>60 cm</span></div></div>'+
   '<div><span class="lab">Couches</span>'+chips(['Aucune','Légères','Marquées'],1)+'</div>'+
   '<div><span class="lab">Frange</span>'+chips(['Sans','Rideau','Droite'],0)+'</div>'+
   '<div><span class="lab">Couleur</span>'+chips(['Naturelle','Balayage','Patine'],0)+'</div>'+
   '<div style="margin-top:auto"><button type="button" class="btn">Voir le profil client</button></div>';
  return '<div><h2>Skin fade</h2><p class="sub">Règle chaque ingrédient.</p></div>'+
   '<div><span class="lab">Côtés, sabot du bas</span>'+chips(['0,5','1','1,5','2'],0)+'</div>'+
   '<div><span class="lab">Dessus</span><input class="range" type="range" min="1" max="12" value="5" aria-label="Longueur du dessus"><div class="rl"><span>1 cm</span><span>5 cm</span><span>12 cm</span></div></div>'+
   '<div><span class="lab">Barbe</span>'+chips(['Aucune','Entretenue','Longue'],1)+'</div>'+
   '<div><span class="lab">Contours</span>'+chips(['Nets','Naturels'],0)+'</div>'+
   '<div style="margin-top:auto"><button type="button" class="btn">Voir le profil client</button></div>';}},
 {n:'Client',tab:'cli',html:function(t){
  var warn=t==='salon'?['Cheveux fins','Garder du volume en haut : une coupe très dégradée aplatit la forme.']:['Golfes marqués','Garder du dessus pour couvrir la ligne frontale.'];
  return '<div><h2>Profil client</h2><p class="sub">5 réponses, pas plus.</p></div>'+
  '<div><span class="lab">Texture</span>'+chips(['Lisses','Ondulés','Bouclés','Crépus'],1)+'</div>'+
  '<div><span class="lab">Visage</span>'+chips(['Ovale','Rond','Carré','Allongé'],0)+'</div>'+
  '<div><span class="lab">Longueur actuelle</span>'+chips(['Courte','Moyenne','Longue'],1)+'</div>'+
  '<div class="alerte"><b>'+warn[0]+'</b><br><span class="mute">'+warn[1]+'</span></div>'+
  '<div style="margin-top:auto"><button type="button" class="btn">Générer les prompts</button></div>';}},
 {n:'Fond',tab:'rec',html:function(t){
  var F=[['D\'origine','transparent'],['Gris studio','#C9CDD1'],['Blanc uni','#FFFFFF'],['Couleur unie','#7C93A8'],['Salon flou','#D8C9BD'],['Dehors flou','#9FB59A']];
  return '<div><h2>Fond</h2><p class="sub">Le fond change, la coiffure reste identique.</p></div>'+
  '<div class="fonds">'+F.map(function(f,i){return '<button type="button" class="fond" aria-pressed="'+(i===1)+'"><span class="sw" style="background:'+f[1]+(i===0?';border-style:dashed':'')+'"></span>'+f[0]+'</button>'}).join('')+'</div>'+
  '<div><span class="lab">Couleur unie</span><div class="grp">'+['#7C93A8','#B8A28A','#8FA58F','#A08FA8'].map(function(c,i){return '<button type="button" class="chip" aria-label="Couleur '+(i+1)+'" aria-pressed="'+(i===0)+'" style="width:48px;padding:0;background:'+c+'"></button>'}).join('')+'</div></div>'+
  '<div style="margin-top:auto"><button type="button" class="btn">Appliquer</button></div>';}},
 {n:'Résultat',tab:'res',html:function(t){
  var bar=mode(t)==='salon'?'Tu es un coiffeur expert. Image 1 = la cliente ou le client avant. Image 2 = la coupe souhaitée…':'Tu es un barbier expert. Image 1 = le client avant. Image 2 = la coupe souhaitée…';
  var P=[['Étape 1 · Diagnostic','Tu es un barbier expert. Voici la photo d\'un client et la coupe qu\'il souhaite : Skin fade, dessus texturé. Avant toute génération d\'image, analyse la faisabilité…'],
         ['Étape 2 · Image','Edit this photo: change ONLY the haircut to: skin fade, textured crop on top. Strict rules: modify ONLY the hair. Everything else must stay identical…'],
         ['Étape 3 · Fiche',bar]];
  if(t==='salon'){P[0][1]='Tu es un coiffeur expert. Voici la photo d\'une cliente et la coupe qu\'elle souhaite : Carré plongeant. Avant toute génération d\'image, analyse la faisabilité…';P[1][1]='Edit this photo: change ONLY the haircut to: chin-length bob, longer in front. Strict rules: modify ONLY the hair. Everything else must stay identical…'}
  return '<div><h2>Résultat</h2><p class="sub">Copie, ouvre Gemini, colle, joins la photo.</p></div>'+
  P.map(function(p){return '<div class="carte" style="padding:16px 16px 8px"><p class="step">'+p[0]+'</p><div class="prompt">'+p[1]+'</div><div class="row" style="margin-bottom:8px"><button type="button" class="btn2 copy">Copier</button><a class="btn2" href="https://gemini.google.com/app" target="_blank" rel="noopener">Ouvrir Gemini</a></div></div>'}).join('')+
  '<div class="row"><button type="button" class="btn2">Enregistrer</button><button type="button" class="btn2">Partager</button></div>';}}
];

function render(t){
  var g=document.getElementById('grid');
  g.innerHTML=SCREENS.map(function(s,i){
    return '<div class="cell"><p class="cap"><b>'+(i+1)+'</b> · '+s.n+'</p><div class="app" data-t="'+t+'"><div class="stripes" aria-hidden="true">'+new Array(40).join('<i></i>')+'</div><div class="body">'+s.html(t)+'</div>'+tabs(s.tab)+'</div></div>';
  }).join('');
  document.getElementById('facts').innerHTML=THEMES[t].facts.map(function(f){return '<li>'+f+'</li>'}).join('');
  document.querySelectorAll('.bar button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.set===t))});
}
function themeFromHash(){var h=(location.hash||'').slice(1);return THEMES[h]?h:'neutre'}
document.querySelector('.bar').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;try{location.hash=b.dataset.set}catch(x){}render(b.dataset.set)});
window.addEventListener('hashchange',function(){render(themeFromHash())});
document.getElementById('grid').addEventListener('click',function(e){
  var c=e.target.closest('.chip');
  if(c&&c.parentElement.classList.contains('grp')){c.parentElement.querySelectorAll('.chip').forEach(function(x){x.setAttribute('aria-pressed','false')});c.setAttribute('aria-pressed','true');return}
  var f=e.target.closest('.fond');
  if(f){f.parentElement.querySelectorAll('.fond').forEach(function(x){x.setAttribute('aria-pressed','false')});f.setAttribute('aria-pressed','true');return}
  var k=e.target.closest('.cut');
  if(k){k.parentElement.querySelectorAll('.cut').forEach(function(x){x.classList.remove('on')});k.classList.add('on');return}
  var cp=e.target.closest('.copy');
  if(cp){var txt=cp.closest('.carte').querySelector('.prompt').textContent;
    var done=function(){cp.textContent='Copié';setTimeout(function(){cp.textContent='Copier'},1500)};
    try{navigator.clipboard.writeText(txt).then(done,done)}catch(x){done()}}
});
render(themeFromHash());
</script>
